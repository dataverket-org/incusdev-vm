version: "3"

tasks:
  # Plain "task" lists the tasks. It has no description, so it is not listed.
  default:
    silent: true
    cmds:
      - task --list

  up:
    desc: Create the VM, or start it, in the background. Follow it with task status
    silent: true
    cmds:
      - bin/up {{.CLI_ARGS}}

  status:
    desc: Show the VM and its services, and follow a start while it is at work
    silent: true
    cmds:
      - bin/status

  check:
    desc: Run the end-to-end test
    silent: true
    cmds:
      - bin/check

  dashboard:
    desc: "Open both dashboards in the browser. One of them: task dashboard -- incus, or -- ceph"
    silent: true
    cmds:
      - bin/dash {{.CLI_ARGS}}

  s3-credentials:
    desc: "Print the S3 endpoint and keys as environment variables. For the RadosGW admin user: task s3-credentials -- admin"
    silent: true
    cmds:
      - bin/s3-credentials {{.CLI_ARGS}}

  reset:
    desc: Put the VM back to how it was right after the install, in about 30 seconds
    prompt: Replace the VM with the saved copy? Everything made in it is lost.
    silent: true
    cmds:
      - bin/reset

  down:
    desc: Stop the VM, keep its disk
    silent: true
    cmds:
      - bin/down

  destroy:
    desc: Delete the VM, everything in it, and the saved copy
    prompt: Delete the VM and everything in it?
    silent: true
    cmds:
      - bin/destroy

  lint:
    desc: Run shellcheck on the scripts and validate lima.yaml
    cmds:
      - shellcheck -s bash -e SC2034,SC2154,SC1090,SC1091,SC2242 bin/* provision/*.sh
      - limactl validate lima.yaml
