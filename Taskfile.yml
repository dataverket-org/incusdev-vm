version: "3"

tasks:
  # Plain "task" lists the tasks. It has no description, so it is not listed.
  default:
    silent: true
    cmds:
      - task --list

  up:
    desc: "Create the VM, or start it; task status follows"
    silent: true
    cmds:
      - bin/up {{.CLI_ARGS}}

  status:
    desc: "The VM and its services; follows a start"
    silent: true
    cmds:
      - bin/status

  check:
    desc: "End-to-end test with a container; -- --vm: a VM"
    silent: true
    cmds:
      - bin/check {{.CLI_ARGS}}

  dashboard:
    desc: "Open the dashboards; one: -- incus or -- ceph"
    silent: true
    cmds:
      - bin/dash {{.CLI_ARGS}}

  s3-credentials:
    desc: "S3 endpoint and keys as env vars; -- admin too"
    silent: true
    cmds:
      - bin/s3-credentials {{.CLI_ARGS}}

  reset:
    desc: "The VM as right after the install, in 30 s"
    prompt: Replace the VM with the saved copy? Everything made in it is lost.
    silent: true
    cmds:
      - bin/reset

  down:
    desc: Stop the VM, keep its disk
    silent: true
    cmds:
      - bin/down

  destroy:
    desc: "Delete the VM, everything in it, the saved copy"
    prompt: Delete the VM and everything in it?
    silent: true
    cmds:
      - bin/destroy

  lint:
    desc: "shellcheck on the scripts, validate lima.yaml"
    cmds:
      - shellcheck -s bash -e SC2034,SC2154,SC1090,SC1091,SC2242 bin/* provision/*.sh
      - limactl validate lima.yaml
