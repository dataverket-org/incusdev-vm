version: "3"

tasks:
  # Plain "task" lists the tasks. It has no description, so it is not listed.
  default:
    silent: true
    cmds:
      - task --list

  up:
    desc: "Create the VM, or start it; -- --ceph --bgp --source"
    silent: true
    cmds:
      - bin/up {{.CLI_ARGS}}

  status:
    desc: "The VM and its services; follows a start"
    silent: true
    cmds:
      - bin/status

  build:
    desc: "With --source: build Incus again, restart incusd"
    silent: true
    cmds:
      - bin/build {{.CLI_ARGS}}

  debug:
    desc: "With --source: Delve on incusd, on 127.0.0.1:26873"
    silent: true
    cmds:
      - bin/debug {{.CLI_ARGS}}

  incus:
    desc: "The incusdev remote for your incus; -- --client"
    silent: true
    cmds:
      - bin/incus-remote {{.CLI_ARGS}}

  check:
    desc: "End-to-end test with a container; -- --vm: a VM"
    silent: true
    cmds:
      - bin/check {{.CLI_ARGS}}

  dashboard:
    desc: "Open the dashboards; one: -- incus or -- ceph"
    silent: true
    cmds:
      - bin/dash {{.CLI_ARGS}}

  s3-credentials:
    desc: "With Ceph: S3 endpoint and keys; -- admin too"
    silent: true
    cmds:
      - bin/s3-credentials {{.CLI_ARGS}}

  tor:
    desc: "BGP session and routes; -- shell: a shell in the ToR"
    silent: true
    cmds:
      - bin/tor {{.CLI_ARGS}}

  routed:
    desc: "Test instance, routed NIC; -- 2, --vm, --delete"
    silent: true
    cmds:
      - bin/routed {{.CLI_ARGS}}

  reset:
    desc: "The VM as right after the install, in 30 s"
    prompt: Replace the VM with the saved copy? Everything made in it is lost.
    silent: true
    cmds:
      - bin/reset

  down:
    desc: Stop the VM, keep its disk
    silent: true
    cmds:
      - bin/down

  destroy:
    desc: "Delete the VM, everything in it, the saved copy"
    prompt: Delete the VM and everything in it?
    silent: true
    cmds:
      - bin/destroy

  lint:
    desc: "shellcheck on the scripts, validate the Lima files"
    cmds:
      - shellcheck -s bash -e SC2034,SC2154,SC1090,SC1091,SC2242 bin/* share/incusdev-vm/*.sh provision/*.sh
      - limactl validate lima.yaml
