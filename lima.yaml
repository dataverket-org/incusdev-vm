# incusdev: Debian 13 (trixie) as a testbed for Incus with virtual machines
# and Ceph storage. Start it with "task up", not limactl directly: it picks
# the VM type and turns nested virtualization on.

minimumLimaVersion: "2.0.0"

# Debian's official cloud image, the "generic" variant, of one dated build.
# It has the full Debian kernel, with the kvm, vhost and rbd modules.
# Renovate proposes newer builds, see renovate.json.
images:
- location: "https://cloud.debian.org/images/cloud/trixie/20260914-2601/debian-13-generic-amd64-20260914-2601.qcow2"
  arch: "x86_64"
- location: "https://cloud.debian.org/images/cloud/trixie/20260914-2601/debian-13-generic-arm64-20260914-2601.qcow2"
  arch: "aarch64"

# The smallest size that runs Ceph and one small virtual machine in Incus.
# For more: task up -- --cpus 4 --memory 8 --disk 40
cpus: 2
memory: "2GiB"
disk: "20GiB"

mounts: []

containerd:
  system: false
  user: false

# What tells one Incus host from the other, as the provision scripts take it.
# These are incusdev's; "task up" sets incusdev2's, see
# share/incusdev-vm/incusdev-vm.sh.
param:
  INCUS_SUBNET: "10.158.42.1/24"
  INCUSDEV_CEPH: "yes"
  BGP_ASN: "65001"
  BGP_ROUTED4: "203.0.113.0/24"
  BGP_ROUTED6: "2001:db8:200::/48"

# The scripts that also install the testbed on a Debian host. Lima copies
# them into the VM when it is created, so a change to them needs a new VM,
# and runs them as root on every start. bird.sh does nothing unless the VM
# was made with "task up -- --tor", which gives it the link to the ToR, and
# ceph.sh nothing in incusdev2.
#
# The boot step makes incus-admin a default group for new users, before Lima
# creates the VM's user: a group that incus.sh adds would only count after a
# restart. It also gives root its id ranges for Incus's containers before the
# package starts the daemon, which reads /etc/subuid only then; left to the
# package, the range may land elsewhere when the VM's user already holds the
# default one, and containers then fail to map their ids.
provision:
- mode: boot
  script: |
    #!/bin/sh
    getent passwd "{{.User}}" >/dev/null && exit 0
    groupadd --system incus-admin
    echo "GROUPS=incus-admin" >> /etc/default/useradd
    getsubids root >/dev/null 2>&1 || echo "root:1000000:1000000000" >> /etc/subuid
    getsubids -g root >/dev/null 2>&1 || echo "root:1000000:1000000000" >> /etc/subgid
# The settings above, where the scripts read them. Lima writes the file
# before it runs them.
- mode: data
  path: /etc/default/incusdev-vm
  content: |
    INCUS_SUBNET="{{.Param.INCUS_SUBNET}}"
    INCUSDEV_CEPH="{{.Param.INCUSDEV_CEPH}}"
    BGP_ASN="{{.Param.BGP_ASN}}"
    BGP_ROUTED4="{{.Param.BGP_ROUTED4}}"
    BGP_ROUTED6="{{.Param.BGP_ROUTED6}}"
- mode: system
  file: provision/incus.sh
- mode: system
  file: provision/bird.sh
- mode: system
  file: provision/ceph.sh

# The services reachable from the host, all on 127.0.0.1, in a block of
# ports from 26870 that nothing well-known uses and that the ephemeral
# ranges of Linux and macOS leave alone; inside the VM they keep their own
# ports, which a Debian host without Lima offers as they are. Nothing else
# is forwarded. incusdev2 has the three ports after these, see
# share/incusdev-vm/incusdev-vm.sh, which lists them for both; keep the two
# in step.
portForwards:
- guestPort: 8443   # Incus API and web UI
  hostPort: 26870
- guestPort: 8444   # Ceph dashboard
  hostPort: 26871
- guestPort: 8000   # S3 API, the Ceph object gateway
  hostPort: 26872
- guestIP: "0.0.0.0"
  guestIPMustBeZero: false
  guestPortRange: [1, 65535]
  ignore: true
